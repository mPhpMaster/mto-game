<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600" viewBox="0 0 420 600" font-family="'Segoe UI', Tahoma, 'Arial Unicode MS', Arial, sans-serif" direction="ltr">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#46d17f" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0a0c18" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <clipPath id="frame"><rect x="8" y="8" width="404" height="584" rx="26"/></clipPath>
  </defs>

  <rect width="420" height="600" rx="30" fill="#05070f"/>
  <g clip-path="url(#frame)">
    <rect x="8" y="8" width="404" height="584" rx="26" fill="url(#bg)"/>

    <!-- الرأس: التكلفة والرقم -->
    <circle cx="66" cy="66" r="30" fill="#46d17f"/>
    <text x="66" y="66" fill="#05070f" font-size="34" font-weight="900" text-anchor="middle" dominant-baseline="central">1</text>
    <rect x="302" y="40" width="86" height="52" rx="14" fill="#000" opacity="0.55"/>
    <text x="345" y="66" fill="#46d17f" font-size="32" font-weight="900" text-anchor="middle" dominant-baseline="central">+2</text>

    <!-- لوحة الرسم -->
    <rect x="34" y="112" width="352" height="238" rx="18" fill="#000" opacity="0.35"/>
    <rect x="34" y="112" width="352" height="238" rx="18" fill="none" stroke="#46d17f" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(34 112) scale(3.3846153846153846 2.7045454545454546)"><defs><radialGradient id="art-act_draw2_grass" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#5fdc93" stop-opacity="0.36"></stop><stop offset="70%" stop-color="#14663c" stop-opacity="0.16"></stop><stop offset="100%" stop-color="#05070f" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="104" height="88" fill="url(#art-act_draw2_grass)" rx="8"></rect><g><rect x="30" y="26" width="26" height="38" rx="4" fill="#5fdc93" stroke="#c2f5d5" stroke-width="1.2" transform="rotate(-14 52 46)"></rect><rect x="39" y="30" width="26" height="38" rx="4" fill="#14663c" stroke="#c2f5d5" stroke-width="1.2" transform="rotate(-5 52 46)"></rect><path d="M52 70 L52 82 M46 76 L52 82 L58 76" stroke="#c2f5d5" stroke-width="3" stroke-linecap="round" fill="none"></path></g></g>

    <!-- الاسم -->
    <text x="210" y="400" fill="#eef1ff" font-size="34" font-weight="900" text-anchor="middle">Draw Two</text>
    <text x="210" y="430" fill="#46d17f" font-size="19" text-anchor="middle" opacity="0.9">Action · Grass</text>
    <line x1="46" y1="448" x2="374" y2="448" stroke="#46d17f" stroke-opacity="0.35" stroke-width="2"/>

    <!-- النص -->
    <text x="210" y="478" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">The opponent draws 2 and loses their</text>
    <text x="210" y="504" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">turn — unless they stack another draw</text>
    <text x="210" y="530" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">card.</text>

    
  </g>
  <rect x="8" y="8" width="404" height="584" rx="26" fill="none" stroke="#46d17f" stroke-opacity="0.55" stroke-width="3"/>
</svg>