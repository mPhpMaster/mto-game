    <rect x="34" y="112" width="352" height="238" rx="18" fill="none" stroke="#c471ff" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(34 112) scale(3.3846153846153846 2.7045454545454546)"><defs><radialGradient id="art-spell_swap" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#cb84ff" stop-opacity="0.36"></stop><stop offset="70%" stop-color="#5b1f8f" stop-opacity="0.16"></stop><stop offset="100%" stop-color="#05070f" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="104" height="88" fill="url(#art-spell_swap)" rx="8"></rect><g fill="none" stroke="#cb84ff" stroke-width="6" stroke-linecap="round"><path d="M28 34 H70"></path><path d="M60 24 L72 34 L60 44" stroke="#ecd0ff"></path><path d="M76 60 H34"></path><path d="M44 50 L32 60 L44 70" stroke="#ecd0ff"></path></g></g>

