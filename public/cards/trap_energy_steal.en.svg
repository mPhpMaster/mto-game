    <circle cx="66" cy="66" r="30" fill="#ffd23d"/>
    <text x="66" y="66" fill="#05070f" font-size="34" font-weight="900" text-anchor="middle" dominant-baseline="central">1</text>
    <rect x="302" y="40" width="86" height="52" rx="14" fill="#000" opacity="0.55"/>
    <text x="345" y="66" fill="#ffd23d" font-size="32" font-weight="900" text-anchor="middle" dominant-baseline="central">3</text>

    <!-- لوحة الرسم -->
    <rect x="34" y="112" width="352" height="238" rx="18" fill="#000" opacity="0.35"/>
    <rect x="34" y="112" width="352" height="238" rx="18" fill="none" stroke="#ffd23d" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(34 112) scale(3.3846153846153846 2.7045454545454546)"><defs><radialGradient id="art-trap_energy_steal" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#ffd83d" stop-opacity="0.36"></stop><stop offset="70%" stop-color="#8a6a00" stop-opacity="0.16"></stop><stop offset="100%" stop-color="#05070f" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="104" height="88" fill="url(#art-trap_energy_steal)" rx="8"></rect><g><path d="M62 14 L38 50 H54 L50 78 L74 40 H58 Z" fill="#ffd83d" stroke="#fff2a8" stroke-width="2"></path><path d="M30 30 Q20 46 30 62" stroke="#fff2a8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"></path><path d="M23 32 Q13 46 23 60" stroke="#fff2a8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"></path><path d="M16 34 Q6 46 16 58" stroke="#fff2a8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"></path></g></g>

    <!-- الاسم -->
    <text x="210" y="400" fill="#eef1ff" font-size="34" font-weight="900" text-anchor="middle">Energy Siphon</text>
    <text x="210" y="430" fill="#ffd23d" font-size="19" text-anchor="middle" opacity="0.9">Trap · Electric</text>
    <line x1="46" y1="448" x2="374" y2="448" stroke="#ffd23d" stroke-opacity="0.35" stroke-width="2"/>

    <!-- النص -->
    <text x="210" y="478" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">At the start of the opponent's turn:</text>
    <text x="210" y="504" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">drain 1 energy, gain 2.</text>

    
