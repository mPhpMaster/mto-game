    <!-- الرأس: التكلفة والرقم -->
    <circle cx="66" cy="66" r="30" fill="#46d17f"/>
    <text x="66" y="66" fill="#05070f" font-size="34" font-weight="900" text-anchor="middle" dominant-baseline="central">2</text>
