    <text x="210" y="400" fill="#eef1ff" font-size="34" font-weight="900" text-anchor="middle">Net</text>
    <text x="210" y="430" fill="#46d17f" font-size="19" text-anchor="middle" opacity="0.9">Trap · Grass</text>
    <line x1="46" y1="448" x2="374" y2="448" stroke="#46d17f" stroke-opacity="0.35" stroke-width="2"/>

    <!-- النص -->
    <text x="210" y="478" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">At the start of the opponent's turn:</text>
    <text x="210" y="504" fill="#cfd5ee" font-size="18" text-anchor="middle" opacity="0.88">they cannot attack this turn.</text>

    
