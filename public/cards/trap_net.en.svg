    <rect x="34" y="112" width="352" height="238" rx="18" fill="#000" opacity="0.35"/>
    <rect x="34" y="112" width="352" height="238" rx="18" fill="none" stroke="#46d17f" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(34 112) scale(3.3846153846153846 2.7045454545454546)"><defs><radialGradient id="art-trap_net" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#5fdc93" stop-opacity="0.36"></stop><stop offset="70%" stop-color="#14663c" stop-opacity="0.16"></stop><stop offset="100%" stop-color="#05070f" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="104" height="88" fill="url(#art-trap_net)" rx="8"></rect><g stroke="#5fdc93" stroke-width="2.5" fill="none"><line x1="28" y1="22" x2="28" y2="70"></line><line x1="40" y1="22" x2="40" y2="70"></line><line x1="52" y1="22" x2="52" y2="70"></line><line x1="64" y1="22" x2="64" y2="70"></line><line x1="76" y1="22" x2="76" y2="70"></line><line x1="28" y1="22" x2="76" y2="22"></line><line x1="28" y1="38" x2="76" y2="38"></line><line x1="28" y1="54" x2="76" y2="54"></line><line x1="28" y1="70" x2="76" y2="70"></line><circle cx="28" cy="38" r="2" fill="#c2f5d5" stroke="none"></circle><circle cx="40" cy="38" r="2" fill="#c2f5d5" stroke="none"></circle><circle cx="52" cy="38" r="2" fill="#c2f5d5" stroke="none"></circle><circle cx="64" cy="38" r="2" fill="#c2f5d5" stroke="none"></circle><circle cx="76" cy="38" r="2" fill="#c2f5d5" stroke="none"></circle></g></g>

