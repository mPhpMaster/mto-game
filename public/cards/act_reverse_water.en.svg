    <rect x="34" y="112" width="352" height="238" rx="18" fill="none" stroke="#3da5ff" stroke-opacity="0.45" stroke-width="2"/>
    <g transform="translate(34 112) scale(3.3846153846153846 2.7045454545454546)"><defs><radialGradient id="art-act_reverse_water" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#4cb4ff" stop-opacity="0.36"></stop><stop offset="70%" stop-color="#134a8f" stop-opacity="0.16"></stop><stop offset="100%" stop-color="#05070f" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="104" height="88" fill="url(#art-act_reverse_water)" rx="8"></rect><g fill="none" stroke="#4cb4ff" stroke-width="6" stroke-linecap="round"><path d="M30 38 A22 22 0 0 1 74 40"></path><path d="M74 54 A22 22 0 0 1 30 52"></path><path d="M68 30 L76 40 L64 44" stroke="#a8e0ff"></path><path d="M36 62 L28 52 L40 48" stroke="#a8e0ff"></path></g></g>

