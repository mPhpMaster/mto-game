    <g transform="translate(34 112) scale(3.3846153846153846 2.7045454545454546)"><defs><radialGradient id="art-trap_curse" cx="50%" cy="42%" r="62%"><stop offset="0%" stop-color="#98a0bd" stop-opacity="0.36"></stop><stop offset="70%" stop-color="#252a45" stop-opacity="0.16"></stop><stop offset="100%" stop-color="#05070f" stop-opacity="0"></stop></radialGradient></defs><rect x="0" y="0" width="104" height="88" fill="url(#art-trap_curse)" rx="8"></rect><g><circle cx="52" cy="40" r="20" fill="#98a0bd"></circle><ellipse cx="45" cy="38" rx="5" ry="7" fill="#0b0e1c"></ellipse><ellipse cx="59" cy="38" rx="5" ry="7" fill="#0b0e1c"></ellipse><path d="M40 58 H64 M46 58 V66 M58 58 V66" stroke="#98a0bd" stroke-width="4" stroke-linecap="round"></path><path d="M52 12 L56 22 L48 22 Z" fill="#d3d8ea"></path></g></g>

